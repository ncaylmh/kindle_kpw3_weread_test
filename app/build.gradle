apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.eink.weread"
        minSdkVersion 19        // Android 4.4.2（KPW3 刷机 ROM）
        targetSdkVersion 19     // 目标 19：完全避开运行时权限模型
        versionCode 10
        versionName "2.7-offline"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

dependencies {
    // 纯 Java 二维码生成（无 Android 依赖，API 19 可用）
    implementation 'com.google.zxing:core:3.4.1'
}
