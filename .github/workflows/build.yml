name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # ubuntu-latest 预装 Android SDK（ANDROID_HOME 已就绪），
      # AGP 会自动补齐缺失的 platform 28 / build-tools，无需额外 setup 步骤

      - name: Set up Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # APK 命名：weread_0、weread_1、weread_2 ……（序号 = 提交数 - 1，首版为 0）
      - name: Rename APK to weread_<n>.apk
        id: naming
        run: |
          N=$(( $(git rev-list --count HEAD) - 1 ))
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          mkdir -p out
          cp "$SRC" "out/weread_${N}.apk"
          echo "name=weread_${N}" >> $GITHUB_OUTPUT
          echo "APK → weread_${N}.apk (source: $SRC)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: out/*.apk
