<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="720" height="400" fill="#f6f8fa"/>
  <!-- browser bar -->
  <rect x="10" y="10" width="700" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="28" cy="27" r="5" fill="#ff5f57"/><circle cx="44" cy="27" r="5" fill="#febc2e"/><circle cx="60" cy="27" r="5" fill="#28c840"/>
  <rect x="140" y="17" width="440" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="360" y="31" font-size="12" fill="#57606a" text-anchor="middle">github.com/ncaylmh/kindle_kpw3_weread_test</text>
  <!-- repo header -->
  <rect x="10" y="56" width="700" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="84" font-size="15" fill="#24292f" font-weight="bold">ncaylmh / kindle_kpw3_weread_test</text>
  <text x="30" y="99" font-size="10" fill="#57606a">Public</text>
  <!-- tabs -->
  <rect x="30" y="112" width="52" height="26" rx="4" fill="#f6f8fa"/>
  <text x="56" y="129" font-size="12" fill="#24292f" text-anchor="middle">Code</text>
  <text x="112" y="129" font-size="12" fill="#57606a" text-anchor="middle">Issues</text>
  <text x="172" y="129" font-size="12" fill="#57606a" text-anchor="middle">Pull requests</text>
  <rect x="222" y="108" width="58" height="34" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="251" y="129" font-size="12" fill="#0969da" font-weight="bold" text-anchor="middle">Actions</text>
  <!-- pointer -->
  <path d="M247 148 l0 26 l6 -6 l5 12 l6 -3 l-5 -11 l9 -1 z" fill="#cf222e" stroke="#ffffff" stroke-width="1.5"/>
  <!-- steps text -->
  <rect x="440" y="150" width="260" height="90" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="456" y="172" font-size="13" fill="#24292f" font-weight="bold">第 1 步</text>
  <text x="456" y="192" font-size="12" fill="#24292f">打开你的仓库页面，点击顶部的</text>
  <text x="456" y="210" font-size="12" fill="#24292f" font-weight="bold" fill="#0969da">「Actions」</text>
  <text x="456" y="228" font-size="12" fill="#24292f">标签（蓝框处）</text>
  <!-- workflow list panel -->
  <rect x="10" y="150" width="410" height="230" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="26" y="176" font-size="13" fill="#24292f" font-weight="bold">Build APK</text>
  <text x="26" y="194" font-size="11" fill="#57606a">左侧点这个工作流名称</text>
  <!-- run rows -->
  <rect x="20" y="206" width="390" height="40" rx="4" fill="#f6f8fa"/>
  <circle cx="38" cy="226" r="7" fill="#1a7f37"/>
  <path d="M34 226 l3 3 l6 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="54" y="223" font-size="11" fill="#24292f" font-weight="bold">fix: add missing JSONException import</text>
  <text x="54" y="239" font-size="10" fill="#57606a">main · 刚刚触发 · 成功</text>
  <rect x="20" y="252" width="390" height="40" rx="4" fill="#f6f8fa"/>
  <circle cx="38" cy="272" r="7" fill="#cf222e"/>
  <path d="M34 272 l8 8 M42 272 l-8 8" stroke="#ffffff" stroke-width="2"/>
  <text x="54" y="269" font-size="11" fill="#24292f">ci: drop unstable setup-android step</text>
  <text x="54" y="285" font-size="10" fill="#57606a">main · 失败（旧版本）</text>
  <text x="26" y="316" font-size="12" fill="#24292f" font-weight="bold">第 2 步</text>
  <text x="26" y="336" font-size="12" fill="#24292f">点最新一条 <tspan fill="#1a7f37" font-weight="bold">绿色 ✓</tspan> 的构建记录进入详情</text>
  <text x="26" y="356" font-size="12" fill="#24292f">（红色 ✗ 的是失败的旧记录，不用管）</text>
</svg>
